    <script>
      /* Ensure window.fetch has both getter & setter so browser extensions/interceptors can wrap it safely */
      (function () {
        try {
          var _origFetch = window.fetch;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function () {
              return _currentFetch;
            },
            set: function (fn) {
              _currentFetch = fn;
            }
          });
        } catch (e) {
          try {
            window.fetch = window.fetch;
          } catch (_) {}
        }

        /* Catch unhandled extension errors from chrome-extension:// */
        window.addEventListener('error', function (event) {
          if (
            event.filename &&
            (event.filename.indexOf('chrome-extension://') !== -1 ||
             event.filename.indexOf('moz-extension://') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
